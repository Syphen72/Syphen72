# Echo Command — static game server.
#
# Run from this folder with `docker compose up -d` (or add it as a Dockge
# stack). nginx serves the game as-is — no build step. If the compose file
# lives somewhere else, change the bind mount to the absolute path of this
# folder, e.g. "/volume1/docker/echo-command:/usr/share/nginx/html:ro".
services:
  echo-command:
    image: nginx:1.27-alpine
    container_name: echo-command
    restart: unless-stopped
    ports:
      - "8090:80" # host port — change the left side if 8090 is taken
    volumes:
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
